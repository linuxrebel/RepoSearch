<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Browser</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap');

  /* ── Dark theme (default) ── */
  :root, [data-theme="dark"] {
    --bg: #0a0e14; --surface: #11151c; --surface2: #1a1f2b;
    --border: #2a3040; --text: #c5cdd8; --text-dim: #6b7a8d;
    --accent: #39d353; --accent2: #58a6ff; --accent3: #f0883e;
    --tag-bg: #1e2733; --tag-text: #7eb8da;
    --header-bg: rgba(10,14,20,0.95);
    --modal-overlay: rgba(0,0,0,0.7);
  }

  /* ── Light theme ── */
  [data-theme="light"] {
    --bg: #f0f4f8; --surface: #ffffff; --surface2: #e4eaf1;
    --border: #c8d3df; --text: #1c2b3a; --text-dim: #5a6a7a;
    --accent: #157a2b; --accent2: #0969da; --accent3: #a84a0a;
    --tag-bg: #dde3ea; --tag-text: #1a4a7a;
    --header-bg: rgba(240,244,248,0.95);
    --modal-overlay: rgba(0,0,0,0.45);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition:background 0.2s, color 0.2s; }

  .header {
    border-bottom:1px solid var(--border); padding:1rem 2rem;
    display:flex; align-items:center; gap:1.5rem;
    position:sticky; top:0; background:var(--header-bg); z-index:100;
    backdrop-filter:blur(12px);
  }
  .logo { font-family:'JetBrains Mono',monospace; font-weight:600; font-size:1.1rem; color:var(--accent); white-space:nowrap; }
  .logo span { color:var(--text-dim); font-weight:300; }
  .search-wrap { flex:1; max-width:600px; position:relative; }
  .search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--text-dim); }
  .search-input {
    width:100%; padding:0.6rem 1rem 0.6rem 2.5rem;
    background:var(--surface); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:0.95rem;
    font-family:'DM Sans',sans-serif; outline:none; transition:border 0.2s;
  }
  .search-input:focus { border-color:var(--accent); }
  .search-input::placeholder { color:var(--text-dim); }
  .stats { font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--text-dim); white-space:nowrap; }
  .stats b { color:var(--accent); font-weight:500; }
  .content { padding:1.5rem 2rem; }
  .results-meta { font-size:0.85rem; color:var(--text-dim); margin-bottom:1rem; font-family:'JetBrains Mono',monospace; }
  .results-meta b { color:var(--accent2); }
  .repo-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); gap:1rem; }
  .repo-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:1.2rem 1.4rem;
    transition:border-color 0.2s, transform 0.15s;
  }
  .repo-card:hover { border-color:var(--accent2); transform:translateY(-1px); }
  .repo-name { font-family:'JetBrains Mono',monospace; font-weight:600; font-size:1rem; color:var(--accent2); margin-bottom:0.3rem; display:flex; align-items:center; gap:0.5rem; }
  .repo-name a { color:inherit; text-decoration:none; }
  .repo-name a:hover { text-decoration:underline; }
  .score-badge { font-size:0.65rem; padding:2px 6px; border-radius:4px; font-weight:500; }
  .score-high { background:rgba(57,211,83,0.15); color:#39d353; }
  .score-mid  { background:rgba(240,136,62,0.15); color:#f0883e; }
  .score-low  { background:rgba(107,122,141,0.15); color:#6b7a8d; }
  [data-theme="light"] .score-high { background:#d0f0d8; color:#1a7a2e; }
  [data-theme="light"] .score-mid  { background:#fde4cc; color:#a04008; }
  [data-theme="light"] .score-low  { background:#e2e7ed; color:#455060; }
  [data-theme="light"] .mode-btn:not(.active) { background:var(--surface2); }
  [data-theme="light"] .repo-card { box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  [data-theme="light"] .tag-cloud { background:var(--surface2); }
  .repo-path { font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--text-dim); margin-bottom:0.5rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .repo-desc { font-size:0.85rem; color:var(--text); line-height:1.5; margin-bottom:0.7rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .repo-tags { display:flex; flex-wrap:wrap; gap:0.35rem; }
  .tag { font-family:'JetBrains Mono',monospace; font-size:0.7rem; background:var(--tag-bg); color:var(--tag-text); padding:2px 8px; border-radius:4px; cursor:pointer; transition:background 0.15s; }
  .tag:hover { background:var(--accent2); color:var(--bg); }
  .repo-meta { display:flex; gap:1rem; margin-top:0.6rem; font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--text-dim); }
  .tag-cloud { display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1.5rem; padding:1rem; background:var(--surface); border-radius:10px; border:1px solid var(--border); }
  .tag-cloud-toggle { font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--accent2); cursor:pointer; margin-bottom:0.8rem; display:inline-flex; align-items:center; gap:0.4rem; border:none; background:none; }
  .tag-cloud-toggle:hover { color:var(--accent); }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.6s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .search-mode { display:flex; gap:0.5rem; align-items:center; }
  .mode-btn { font-family:'JetBrains Mono',monospace; font-size:0.7rem; padding:4px 10px; border-radius:5px; border:1px solid var(--border); background:transparent; color:var(--text-dim); cursor:pointer; transition:all 0.15s; }
  .mode-btn.active { background:var(--accent2); color:var(--bg); border-color:var(--accent2); }
  .mode-btn:hover:not(.active) { border-color:var(--text-dim); }

  /* ── Theme toggle ── */
  .theme-btn {
    background:none; border:1px solid var(--border); cursor:pointer;
    padding:4px 10px; border-radius:6px;
    display:flex; align-items:center; gap:0.4rem;
    color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:0.7rem;
    transition:border-color 0.2s, color 0.2s;
    white-space:nowrap;
  }
  .theme-btn svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; flex-shrink:0; }
  .theme-btn:hover { border-color:var(--accent2); color:var(--accent2); }

  /* ── Settings (gear) button ── */
  .gear-btn {
    background:none; border:1px solid var(--border); cursor:pointer;
    padding:4px 10px; border-radius:6px;
    display:flex; align-items:center; gap:0.4rem;
    color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:0.7rem;
    transition:border-color 0.2s, color 0.2s, transform 0.2s;
    white-space:nowrap;
  }
  .gear-btn svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; flex-shrink:0; transition:transform 0.3s; }
  .gear-btn:hover { border-color:var(--accent); color:var(--accent); }
  .gear-btn:hover svg { transform:rotate(45deg); }

  /* ── Modal overlay ── */
  .modal-overlay {
    display:none; position:fixed; inset:0; background:var(--modal-overlay);
    z-index:200; justify-content:center; align-items:center;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:2rem; width:90%; max-width:600px; max-height:80vh; overflow-y:auto;
  }
  .modal h2 { font-family:'JetBrains Mono',monospace; font-size:1.1rem; color:var(--accent); margin-bottom:1.5rem; }
  .modal label { font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--text-dim); display:block; margin-bottom:0.3rem; }
  .field-row { display:flex; gap:0.5rem; margin-bottom:1.2rem; }
  .field-row input {
    flex:1; padding:0.5rem 0.8rem; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:0.85rem; outline:none;
  }
  .field-row input:focus { border-color:var(--accent); }
  .browse-btn {
    padding:0.5rem 1rem; background:var(--surface2); border:1px solid var(--border);
    border-radius:6px; color:var(--text-dim); cursor:pointer; font-family:'JetBrains Mono',monospace;
    font-size:0.8rem; white-space:nowrap; transition:all 0.15s;
  }
  .browse-btn:hover { border-color:var(--accent2); color:var(--accent2); }
  .modal-actions { display:flex; gap:0.8rem; margin-top:1.5rem; }
  .btn-primary {
    padding:0.6rem 1.5rem; background:var(--accent); color:var(--bg); border:none;
    border-radius:6px; font-family:'JetBrains Mono',monospace; font-weight:600;
    font-size:0.85rem; cursor:pointer; transition:opacity 0.15s;
  }
  .btn-primary:hover { opacity:0.85; }
  .btn-secondary {
    padding:0.6rem 1.5rem; background:transparent; color:var(--text-dim); border:1px solid var(--border);
    border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:0.85rem; cursor:pointer;
  }
  .btn-secondary:hover { border-color:var(--text-dim); }
  .config-status {
    font-family:'JetBrains Mono',monospace; font-size:0.75rem; padding:0.6rem 0.8rem;
    background:var(--bg); border-radius:6px; margin-bottom:1.2rem; line-height:1.6;
  }
  .config-status .ok { color:var(--accent); }
  .config-status .warn { color:var(--accent3); }
  .save-msg {
    font-family:'JetBrains Mono',monospace; font-size:0.8rem; margin-top:1rem;
    padding:0.8rem; border-radius:6px; background:rgba(57,211,83,0.1);
    border:1px solid rgba(57,211,83,0.3); color:var(--accent); white-space:pre-line; display:none;
  }

  /* ── Directory browser ── */
  .dir-browser {
    display:none; background:var(--bg); border:1px solid var(--border); border-radius:8px;
    max-height:250px; overflow-y:auto; margin-bottom:1rem;
  }
  .dir-browser.open { display:block; }
  .dir-entry {
    padding:0.4rem 0.8rem; font-family:'JetBrains Mono',monospace; font-size:0.8rem;
    color:var(--text); cursor:pointer; display:flex; align-items:center; gap:0.5rem;
    border-bottom:1px solid var(--border);
  }
  .dir-entry:hover { background:var(--surface2); }
  .dir-entry .icon { color:var(--accent3); }
  .dir-select-btn {
    padding:0.3rem 0.8rem; background:var(--accent2); color:var(--bg); border:none;
    border-radius:4px; font-size:0.7rem; cursor:pointer; margin-left:auto;
    font-family:'JetBrains Mono',monospace;
  }
  .dir-path { font-size:0.75rem; color:var(--text-dim); padding:0.5rem 0.8rem; border-bottom:1px solid var(--border); background:var(--surface); }

  /* ── Clickable repo title + card action row ── */
  .repo-title { cursor:pointer; color:var(--accent2); transition:opacity 0.15s; }
  .repo-title:hover { text-decoration:underline; }
  .repo-actions { display:flex; gap:0.4rem; align-items:center; margin:0.15rem 0 0.6rem; }
  .act-open {
    font-family:'JetBrains Mono',monospace; font-size:0.72rem; font-weight:600;
    padding:3px 14px; border-radius:6px; border:none; background:var(--accent);
    color:var(--bg); cursor:pointer; transition:opacity 0.15s;
  }
  .act-open:hover { opacity:0.85; }
  .act-icon {
    background:transparent; border:1px solid var(--border); border-radius:6px;
    padding:2px 7px; font-size:0.85rem; line-height:1; cursor:pointer;
    transition:border-color 0.15s, background 0.15s;
  }
  .act-icon:hover { border-color:var(--accent2); background:var(--surface2); }
  .act-icon.danger:hover { border-color:#c0392b; }

  /* ── Toast ── */
  .toast {
    position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(1rem);
    background:var(--surface2); color:var(--text); border:1px solid var(--border);
    padding:0.6rem 1.1rem; border-radius:8px; font-family:'JetBrains Mono',monospace;
    font-size:0.8rem; opacity:0; pointer-events:none; transition:opacity 0.2s, transform 0.2s; z-index:300;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── Show-hidden toggle + removable tag chips + hidden card ── */
  .mini-toggle {
    font-family:'JetBrains Mono',monospace; font-size:0.7rem; padding:2px 9px; margin-left:0.5rem;
    border-radius:5px; border:1px solid var(--border); background:transparent;
    color:var(--text-dim); cursor:pointer; transition:border-color 0.15s, color 0.15s;
  }
  .mini-toggle:hover { border-color:var(--accent2); color:var(--accent2); }
  .tag.removable { cursor:default; }
  .tag .rm { cursor:pointer; margin-left:2px; opacity:0.6; }
  .tag .rm:hover { opacity:1; color:#e05a4a; }
  .repo-card.is-hidden { opacity:0.6; border-style:dashed; }

  /* ── Synopsis + README reader modals ── */
  .synopsis-tag { font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--text-dim); margin:-0.8rem 0 0.8rem; }
  .synopsis-tag.code { color:var(--accent3); }
  .synopsis-body { white-space:pre-wrap; line-height:1.6; font-size:0.9rem; color:var(--text); max-height:50vh; overflow-y:auto; padding:0.5rem 0; }
  .synopsis-body.dim { color:var(--text-dim); font-style:italic; }
  .reader-modal { max-width:820px; }
  .readme-render { line-height:1.6; font-size:0.9rem; color:var(--text); max-height:65vh; overflow-y:auto; padding:0.5rem 0.2rem; }
  .readme-render h1,.readme-render h2,.readme-render h3,.readme-render h4 { font-family:'JetBrains Mono',monospace; color:var(--accent); margin:1rem 0 0.5rem; line-height:1.3; }
  .readme-render h1 { font-size:1.3rem; } .readme-render h2 { font-size:1.1rem; } .readme-render h3 { font-size:1rem; }
  .readme-render p { margin:0.6rem 0; }
  .readme-render ul { margin:0.6rem 0 0.6rem 1.4rem; }
  .readme-render li { margin:0.2rem 0; }
  .readme-render a { color:var(--accent2); }
  .readme-render code { font-family:'JetBrains Mono',monospace; font-size:0.82em; background:var(--tag-bg); padding:1px 5px; border-radius:4px; }
  .readme-render pre { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.8rem 1rem; overflow-x:auto; margin:0.7rem 0; }
  .readme-render pre code { background:none; padding:0; }
  .readme-render hr { border:none; border-top:1px solid var(--border); margin:1rem 0; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">repo<span>/</span>browser</div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="searchInput" type="text" placeholder="Search repos… e.g. 'kubernetes monitoring' or 'container orchestration'" autofocus>
  </div>
  <div class="search-mode">
    <button class="mode-btn active" data-mode="both">both</button>
    <button class="mode-btn" data-mode="keyword">keyword</button>
    <button class="mode-btn" data-mode="semantic">semantic</button>
  </div>
  <div class="stats" id="stats"></div>
  <!-- Theme toggle -->
  <button class="theme-btn" id="themeBtn" title="Toggle light/dark theme">
    <!-- icon swapped by JS -->
    <svg id="themeIcon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"></svg>
    <span id="themeLabel"></span>
  </button>
  <!-- Settings -->
  <button class="gear-btn" id="gearBtn" title="Settings">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    Settings
  </button>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>Settings</h2>
    <div class="config-status" id="configStatus"></div>
    <label>gitParent — root directory containing all repos</label>
    <div class="field-row">
      <input type="text" id="cfgGitParent" placeholder="/home/user/git">
      <button class="browse-btn" onclick="openBrowser('gitParent')">browse</button>
    </div>
    <div class="dir-browser" id="browser-gitParent"></div>
    <label>workDir — where repo-browser files live</label>
    <div class="field-row">
      <input type="text" id="cfgWorkDir" placeholder="/home/user/bin/repo-browser">
      <button class="browse-btn" onclick="openBrowser('workDir')">browse</button>
    </div>
    <div class="dir-browser" id="browser-workDir"></div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveConfig()">Save</button>
      <button class="btn-secondary" onclick="closeSettings()">Cancel</button>
    </div>
    <div class="save-msg" id="saveMsg"></div>
  </div>
</div>

<!-- Synopsis Modal -->
<div class="modal-overlay" id="synopsisModal">
  <div class="modal">
    <h2 id="synopsisTitle">Synopsis</h2>
    <div class="synopsis-tag" id="synopsisTag"></div>
    <div class="synopsis-body" id="synopsisBody"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeSynopsis()">Close</button>
      <button class="btn-primary" id="openReadmeBtn">Open Readme</button>
    </div>
  </div>
</div>

<!-- README Reader Modal (read-only) -->
<div class="modal-overlay" id="readerModal">
  <div class="modal reader-modal">
    <h2 id="readerTitle">README</h2>
    <div class="readme-render" id="readerBody"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeReader()">Close</button>
    </div>
  </div>
</div>

<!-- Add-tag Modal -->
<div class="modal-overlay" id="tagModal">
  <div class="modal">
    <h2>Manage tags</h2>
    <div class="config-status" id="tagModalPath"></div>
    <label>Current tags — click ✕ to remove</label>
    <div class="repo-tags" id="tagModalList" style="margin:0.4rem 0 1.2rem"></div>
    <label>Add tags</label>
    <div class="field-row">
      <input type="text" id="tagModalInput" placeholder="e.g. rust, favorite (comma-separated)">
      <button class="btn-primary" onclick="saveTags()">Add</button>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeTagModal()">Done</button>
    </div>
  </div>
</div>

<!-- Delete confirm Modal -->
<div class="modal-overlay" id="delModal">
  <div class="modal">
    <h2 style="color:#e05a4a">Delete repo?</h2>
    <div class="synopsis-body" id="delModalMsg"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeDelModal()">Cancel</button>
      <button class="btn-primary" id="delConfirmBtn" style="background:#c0392b">Delete from disk</button>
    </div>
  </div>
</div>

<div class="content">
  <button class="tag-cloud-toggle" id="tagToggle">▸ tags</button>
  <div class="tag-cloud" id="tagCloud" style="display:none"></div>
  <div class="results-meta" id="resultsMeta"></div>
  <div class="repo-grid" id="repoGrid"></div>
</div>

<script>
const grid = document.getElementById('repoGrid');
const meta = document.getElementById('resultsMeta');
const input = document.getElementById('searchInput');
const statsEl = document.getElementById('stats');
const tagCloud = document.getElementById('tagCloud');
const tagToggle = document.getElementById('tagToggle');
let searchMode = 'both';

// ── Theme toggle ──────────────────────────────────────────────
const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const themeLabel = document.getElementById('themeLabel');

const MOON_PATH = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
const SUN_PATH  = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

function applyTheme(theme) {
  html.setAttribute('data-theme', theme);
  if (theme === 'dark') {
    themeIcon.innerHTML = MOON_PATH;  // dark mode → show sun to switch to light
    themeLabel.textContent = 'Light';
  } else {
    themeIcon.innerHTML = SUN_PATH;   // light mode → show moon to switch to dark
    themeLabel.textContent = 'Dark';
  }
  localStorage.setItem('rb-theme', theme);
}

themeBtn.addEventListener('click', () => {
  applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

// Restore saved theme on load
applyTheme(localStorage.getItem('rb-theme') || 'dark');

// ── Search mode buttons ───────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.mode-btn.active').classList.remove('active');
    btn.classList.add('active');
    searchMode = btn.dataset.mode;
    doSearch();
  });
});
tagToggle.addEventListener('click', () => {
  const open = tagCloud.style.display !== 'none';
  tagCloud.style.display = open ? 'none' : 'flex';
  tagToggle.textContent = (open ? '▸' : '▾') + ' tags';
});

fetch('/api/stats').then(r=>r.json()).then(d => {
  statsEl.innerHTML = `<b>${d.total_repos}</b> repos · <b>${d.embedded}</b> embedded · <b>${d.unique_tags}</b> tags`;
});
fetch('/api/tags').then(r=>r.json()).then(d => {
  tagCloud.innerHTML = d.tags.filter(t => t.count >= 3)
    .map(t => `<span class="tag" onclick="searchTag('${t.tag}')">${t.tag} <small style="opacity:0.5">${t.count}</small></span>`).join('');
});

function searchTag(tag) { input.value = tag; doSearch(); }
// Search fires on Enter — a debounce firing on partial words hurt typing.
input.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
// Clearing the box restores the full list.
input.addEventListener('input', () => { if (!input.value.trim()) { meta.innerHTML = ''; renderAll(); } });

let showHidden = false;
function hiddenToggleHtml(hiddenCount) {
  if (!hiddenCount) return '';   // nothing hidden → no toggle
  return ` <button class="mini-toggle" onclick="toggleHidden()" title="Show/hide hidden repos">${showHidden ? 'Hide' : 'Show'} 🙈</button>`;
}
function toggleHidden() { showHidden = !showHidden; input.value.trim() ? doSearch() : renderAll(); }

async function doSearch() {
  const q = input.value.trim();
  if (!q) { meta.innerHTML = ''; return renderAll(); }
  meta.innerHTML = '<span class="spinner"></span> searching…';
  const t0 = performance.now();
  const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&hidden=${showHidden ? 1 : 0}`);
  const data = await res.json();
  const ms = Math.round(performance.now() - t0);
  let repos = data.repos;
  if (searchMode === 'keyword') repos = repos.filter(r => r.fts_score > 0).sort((a,b) => b.fts_score - a.fts_score);
  else if (searchMode === 'semantic') repos = repos.filter(r => r.sem_score > 0).sort((a,b) => b.sem_score - a.sem_score);
  meta.innerHTML = `<b>${repos.length}</b> results for "<b>${esc(q)}</b>" in ${ms}ms` + hiddenToggleHtml(data.hidden_count);
  renderRepos(repos, true);
}
async function renderAll() {
  const data = await (await fetch(`/api/search?q=&hidden=${showHidden ? 1 : 0}`)).json();
  meta.innerHTML = `showing all <b>${data.repos.length}</b> repos` + hiddenToggleHtml(data.hidden_count);
  renderRepos(data.repos, false);
}
function renderRepos(repos, showScore) {
  grid.innerHTML = repos.map(r => {
    const allTags = (r.tags || '').split(', ').filter(Boolean);
    const isHidden = allTags.includes('hidden');
    const tags = allTags.filter(t => t !== 'hidden');   // 'hidden' is a system marker, not shown
    const sc = r.score >= 0.5 ? 'score-high' : r.score >= 0.25 ? 'score-mid' : 'score-low';
    const badge = showScore && r.score !== undefined ? `<span class="score-badge ${sc}">${(r.score*100).toFixed(0)}%</span>` : '';
    const url = r.url || '';
    const webUrl = url.replace(/\.git$/, '').replace(/^git@([^:]+):/, 'https://$1/').replace(/^ssh:\/\/git@([^/]+)\//, 'https://$1/');
    const openBtn = webUrl ? `<button class="act-open" data-url="${esc(webUrl)}" title="Open the repo's remote page in a new tab">Open</button>` : '';
    const p = esc(r.path);
    const hideBtn = isHidden
      ? `<button class="act-icon" data-act="unhide" data-path="${p}" title="Unhide this repo">👀</button>`
      : `<button class="act-icon" data-act="hide" data-path="${p}" title="Hide this repo from results">🙈</button>`;
    const actions = `<div class="repo-actions">
      ${openBtn}
      <button class="act-icon" data-act="copy" data-path="${p}" title="Copy the repo path">📋</button>
      <button class="act-icon" data-act="tag" data-path="${p}" title="Manage tags">🏷️</button>
      ${hideBtn}
      <button class="act-icon danger" data-act="delete" data-path="${p}" data-name="${esc(r.name)}" title="Delete this repo from disk (rm -rf)">❌</button>
    </div>`;
    const lc = r.last_commit ? new Date(r.last_commit).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
    return `<div class="repo-card${isHidden ? ' is-hidden' : ''}">
      <div class="repo-name"><span class="repo-title" data-path="${p}" title="View synopsis">${esc(r.name)}</span> ${badge}</div>
      ${actions}
      <div class="repo-path">${esc(r.path)}</div>
      ${(r.summary || r.description) ? `<div class="repo-desc">${esc(r.summary || r.description)}</div>` : ''}
      <div class="repo-tags">${tags.map(t=>`<span class="tag" data-tag="${esc(t)}" onclick="searchTag('${esc(t)}')">${esc(t)}</span>`).join('')}</div>
      <div class="repo-meta">${r.default_branch?`<span>⎇ ${esc(r.default_branch)}</span>`:''} ${lc?`<span>⏱ ${lc}</span>`:''}</div>
    </div>`;
  }).join('');
}
function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

// ── Synopsis + README reader ──────────────────────────────────
const readmeRawCache = {};   // repo path -> /api/readme response (for the reader)
const csrf = () => document.querySelector('meta[name="csrf-token"]')?.content || '';
const TAGS = {
  readme: '✓ verbatim — the developer’s description from the README',
  online: '✓ verbatim — the description from the repo host',
  code:   '⚙ AI-generated — read from the project’s code',
};

grid.addEventListener('click', e => {
  const t = e.target.closest('.repo-title');
  if (t) return openSynopsis(t.dataset.path, t.textContent.trim());
  const o = e.target.closest('.act-open');
  if (o) return window.open(o.dataset.url, '_blank', 'noopener');
  const ic = e.target.closest('.act-icon');
  if (!ic) return;
  const path = ic.dataset.path;
  if (ic.dataset.act === 'copy') return copyPath(path);
  if (ic.dataset.act === 'tag') return openTagModal(path, ic);
  if (ic.dataset.act === 'hide') return hideRepo(path, ic);
  if (ic.dataset.act === 'unhide') return unhideRepo(path, ic);
  if (ic.dataset.act === 'delete') return openDelModal(path, ic.dataset.name, ic);
});

// ── Toast ─────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Card actions: copy / tag / hide / delete ──────────────────
function copyPath(path) {
  navigator.clipboard.writeText(path).then(() => toast('Path copied')).catch(() => toast('Copy failed'));
}
function dropCard(el) {
  const card = el.closest('.repo-card');
  if (!card) return;
  card.style.transition = 'opacity 0.25s';
  card.style.opacity = '0';
  setTimeout(() => card.remove(), 260);
}

async function post(url) {
  return (await fetch(url, { method: 'POST', headers: { 'X-CSRF-Token': csrf() } })).json();
}

let _tagPath = null, _tagCard = null;
const tagModal = document.getElementById('tagModal');
const tagModalList = document.getElementById('tagModalList');
tagModal.addEventListener('click', e => { if (e.target === tagModal) closeTagModal(); });
tagModalList.addEventListener('click', e => {
  const rm = e.target.closest('.rm');
  if (rm) removeTag(rm.dataset.tag);
});

function cardTags(card) {
  return [...(card ? card.querySelectorAll('.repo-tags .tag') : [])]
    .map(t => t.dataset.tag).filter(t => t && t !== 'hidden');
}
function renderTagModalList() {
  const tags = cardTags(_tagCard);
  tagModalList.innerHTML = tags.length
    ? tags.map(t => `<span class="tag removable">${esc(t)} <span class="rm" data-tag="${esc(t)}" title="Remove">✕</span></span>`).join('')
    : '<span style="color:var(--text-dim);font-size:0.8rem">no tags yet</span>';
}
function openTagModal(path, el) {
  _tagPath = path;
  _tagCard = el.closest('.repo-card');
  document.getElementById('tagModalPath').textContent = path;
  document.getElementById('tagModalInput').value = '';
  renderTagModalList();
  tagModal.classList.add('open');
  document.getElementById('tagModalInput').focus();
}
function closeTagModal() { tagModal.classList.remove('open'); }
async function saveTags() {
  const input = document.getElementById('tagModalInput');
  const tags = input.value.trim();
  if (!tags) return;
  const r = await post('/api/add-tags?path=' + encodeURIComponent(_tagPath) + '&tags=' + encodeURIComponent(tags));
  if (!r.ok) return toast('Failed: ' + (r.error || ''));
  // reflect on the card chips, then re-render the modal list from the card
  const wrap = _tagCard && _tagCard.querySelector('.repo-tags');
  (r.added || []).forEach(t => {
    if (t !== 'hidden' && wrap && !wrap.querySelector(`.tag[data-tag="${CSS.escape(t)}"]`)) {
      wrap.insertAdjacentHTML('beforeend', `<span class="tag" data-tag="${esc(t)}" onclick="searchTag('${esc(t)}')">${esc(t)}</span>`);
    }
  });
  input.value = '';
  renderTagModalList();
  toast('Tag added');
}
async function removeTag(tag) {
  const r = await post('/api/remove-tag?path=' + encodeURIComponent(_tagPath) + '&tag=' + encodeURIComponent(tag));
  if (!r.ok) return toast('Remove failed');
  const chip = _tagCard && _tagCard.querySelector(`.repo-tags .tag[data-tag="${CSS.escape(tag)}"]`);
  if (chip) chip.remove();
  renderTagModalList();
  toast('Removed ' + tag);
}

async function hideRepo(path, el) {
  const r = await post('/api/add-tags?path=' + encodeURIComponent(path) + '&tags=hidden');
  if (r.ok) { toast('Repo hidden'); dropCard(el); } else { toast('Failed to hide'); }
}
async function unhideRepo(path, el) {
  const r = await post('/api/remove-tag?path=' + encodeURIComponent(path) + '&tag=hidden');
  if (r.ok) { toast('Repo unhidden'); showHidden ? doSearchOrAll() : dropCard(el); } else { toast('Failed to unhide'); }
}
function doSearchOrAll() { input.value.trim() ? doSearch() : renderAll(); }

let _delPath = null, _delEl = null;
const delModal = document.getElementById('delModal');
delModal.addEventListener('click', e => { if (e.target === delModal) closeDelModal(); });
document.getElementById('delConfirmBtn').addEventListener('click', confirmDelete);
function openDelModal(path, name, el) {
  _delPath = path; _delEl = el;
  document.getElementById('delModalMsg').innerHTML =
    'This permanently removes <b>' + esc(name) + '</b> from disk:<br><br>' +
    '<code>rm -rf ' + esc(path) + '</code><br><br>This cannot be undone.';
  delModal.classList.add('open');
}
function closeDelModal() { delModal.classList.remove('open'); }
async function confirmDelete() {
  const r = await (await fetch('/api/delete?path=' + encodeURIComponent(_delPath),
    { method: 'POST', headers: { 'X-CSRF-Token': csrf() } })).json();
  closeDelModal();
  if (r.ok) { toast('Repo deleted'); dropCard(_delEl); } else { toast('Delete failed: ' + (r.error || '')); }
}

const synopsisModal = document.getElementById('synopsisModal');
const readerModal = document.getElementById('readerModal');
synopsisModal.addEventListener('click', e => { if (e.target === synopsisModal) closeSynopsis(); });
readerModal.addEventListener('click', e => { if (e.target === readerModal) closeReader(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeReader(); closeSynopsis(); closeTagModal(); closeDelModal(); }
});

function showSynopsis(path, text, kind) {
  const body = document.getElementById('synopsisBody');
  const tag = document.getElementById('synopsisTag');
  tag.textContent = TAGS[kind] || '';
  tag.className = 'synopsis-tag' + (kind === 'code' ? ' code' : '');
  body.textContent = (kind === 'code'
    ? 'No written description was found — this synopsis was generated by reading the project’s code.\n\n'
    : '') + text;
  body.className = 'synopsis-body';
  const btn = document.getElementById('openReadmeBtn');
  btn.style.display = '';
  btn.onclick = () => openReader(path);
}

async function openSynopsis(path, name) {
  const body = document.getElementById('synopsisBody');
  const tag = document.getElementById('synopsisTag');
  document.getElementById('synopsisTitle').textContent = name || 'Synopsis';
  tag.textContent = '';
  body.textContent = 'Reading the README… one moment.'; body.className = 'synopsis-body dim';
  synopsisModal.classList.add('open');

  // 1) cached?
  try {
    const c = await (await fetch('/api/synopsis?path=' + encodeURIComponent(path))).json();
    if (c.cached) return showSynopsis(path, c.synopsis, c.kind);
  } catch (_) { /* fall through to generate */ }

  // 2) generate from README / repo host
  try {
    const r = await (await fetch('/api/synopsis?path=' + encodeURIComponent(path) + '&stage=light',
      { method: 'POST', headers: { 'X-CSRF-Token': csrf() } })).json();
    if (r.found) return showSynopsis(path, r.synopsis, r.kind);
  } catch (_) { /* fall through to code */ }

  // 3) nothing authored — read the code
  body.textContent = 'The README contained no obvious Synopsis we are reading the project and generating our own. Please be patient';
  body.className = 'synopsis-body dim';
  try {
    const r = await (await fetch('/api/synopsis?path=' + encodeURIComponent(path) + '&stage=code',
      { method: 'POST', headers: { 'X-CSRF-Token': csrf() } })).json();
    if (r.found) return showSynopsis(path, r.synopsis, r.kind);
  } catch (_) { /* show failure below */ }
  body.textContent = 'Could not generate a synopsis for this repo.';
  body.className = 'synopsis-body dim';
  document.getElementById('synopsisTag').textContent = '';
}
function closeSynopsis() { synopsisModal.classList.remove('open'); }

async function openReader(path) {
  const titleEl = document.getElementById('readerTitle');
  const bodyEl = document.getElementById('readerBody');
  titleEl.textContent = 'README';
  bodyEl.innerHTML = '<p style="color:var(--text-dim)">Loading…</p>';
  readerModal.classList.add('open');
  let data = readmeRawCache[path];
  if (!data) {
    try { data = await (await fetch('/api/readme?path=' + encodeURIComponent(path))).json(); }
    catch (err) { data = { ok: false, error: String(err) }; }
    readmeRawCache[path] = data;
  }
  if (data.ok) {
    titleEl.textContent = (data.name || 'README') + ' — README';
    bodyEl.innerHTML = renderMarkdown(data.raw || '');
  } else {
    bodyEl.innerHTML = '<p style="color:var(--text-dim)">' + esc(data.error || 'No README in this repo.') + '</p>';
  }
}
function closeReader() { readerModal.classList.remove('open'); }

// Minimal markdown → HTML. Common cases only (headings, bold/italic, inline +
// fenced code, unordered lists, links, hr, paragraphs); not full CommonMark.
function renderMarkdown(md) {
  const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = s => e(s)
    .replace(/`([^`]+)`/g, (m,c) => '<code>'+c+'</code>')
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m,alt,src) => '<img src="'+encodeURI(src)+'" alt="'+alt+'" style="max-width:100%">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,txt,u) => '<a href="'+encodeURI(u)+'" target="_blank" rel="noopener">'+txt+'</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const lines = md.split('\n');
  let html = '', i = 0, inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const special = l => /^\s*(#{1,6}\s|```|[-*+]\s|(-{3,}|\*{3,}|_{3,})\s*$)/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      closeList(); i++;
      let code = '';
      while (i < lines.length && !/^\s*```/.test(lines[i])) { code += lines[i] + '\n'; i++; }
      i++;
      html += '<pre><code>' + e(code) + '</code></pre>';
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); const lv = h[1].length; html += '<h'+lv+'>' + inline(h[2]) + '</h'+lv+'>'; i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeList(); html += '<hr>'; i++; continue; }
    if (/^\s*[-*+]\s+/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + inline(line.replace(/^\s*[-*+]\s+/, '')) + '</li>'; i++; continue;
    }
    if (line.trim() === '') { closeList(); i++; continue; }
    closeList();
    let para = line; i++;
    while (i < lines.length && lines[i].trim() !== '' && !special(lines[i])) { para += ' ' + lines[i]; i++; }
    html += '<p>' + inline(para) + '</p>';
  }
  closeList();
  return html;
}

// ── Settings ──────────────────────────────────────────────────
const gearBtn = document.getElementById('gearBtn');
const settingsModal = document.getElementById('settingsModal');
gearBtn.addEventListener('click', openSettings);
settingsModal.addEventListener('click', e => { if (e.target === settingsModal) closeSettings(); });

async function openSettings() {
  settingsModal.classList.add('open');
  const res = await fetch('/api/config');
  const cfg = await res.json();
  document.getElementById('cfgGitParent').value = cfg.gitParent || '';
  document.getElementById('cfgWorkDir').value = cfg.workDir || '';
  const status = document.getElementById('configStatus');
  if (cfg.installed) {
    status.innerHTML = `<span class="ok">✓ Config loaded from /etc/rb.config</span>`;
  } else if (cfg.configSource) {
    status.innerHTML = `<span class="warn">⚠ Using local config: ${cfg.configSource}</span><br>Copy to /etc for system-wide use`;
  } else {
    status.innerHTML = `<span class="warn">⚠ No config file found — set values below</span>`;
  }
  document.getElementById('saveMsg').style.display = 'none';
}
function closeSettings() { settingsModal.classList.remove('open'); closeBrowsers(); }

async function saveConfig() {
  const gitParent = document.getElementById('cfgGitParent').value.trim();
  const workDir = document.getElementById('cfgWorkDir').value.trim();
  if (!gitParent || !workDir) { alert('Both fields are required'); return; }
  const csrf = document.querySelector('meta[name="csrf-token"]')?.content || '';
  const res = await fetch('/api/config', {
    method: 'POST', headers: {'Content-Type':'application/json', 'X-CSRF-Token': csrf},
    body: JSON.stringify({gitParent, workDir})
  });
  const data = await res.json();
  const msg = document.getElementById('saveMsg');
  msg.textContent = data.message;
  msg.style.display = 'block';
}

// ── Directory Browser ─────────────────────────────────────────
function closeBrowsers() {
  document.querySelectorAll('.dir-browser').forEach(b => b.classList.remove('open'));
}
async function openBrowser(field) {
  const browser = document.getElementById('browser-' + field);
  const input = document.getElementById(field === 'gitParent' ? 'cfgGitParent' : 'cfgWorkDir');
  const startPath = input.value || '/home';
  browser.classList.toggle('open');
  if (browser.classList.contains('open')) await loadDir(field, startPath);
}
async function loadDir(field, path) {
  const browser = document.getElementById('browser-' + field);
  const res = await fetch(`/api/browse?path=${encodeURIComponent(path)}`);
  const data = await res.json();
  let html = `<div class="dir-path">${esc(data.path)} <button class="dir-select-btn" onclick="selectDir('${field}','${esc(data.path)}')">select this</button></div>`;
  if (data.error) html += `<div class="dir-entry" style="color:var(--accent3)">${data.error}</div>`;
  for (const e of data.entries) {
    html += `<div class="dir-entry" onclick="loadDir('${field}','${esc(e.path)}')"><span class="icon">📁</span> ${esc(e.name)}</div>`;
  }
  browser.innerHTML = html;
}
function selectDir(field, path) {
  const input = document.getElementById(field === 'gitParent' ? 'cfgGitParent' : 'cfgWorkDir');
  input.value = path;
  document.getElementById('browser-' + field).classList.remove('open');
}

renderAll();
</script>
</body>
</html>
